<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEEM — Authentication Successful</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #0c0c12;
      --accent: #ffffff;
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ═══ Clean Card Container ═══ */
    .card-container {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      background: #09090d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .success-icon-wrapper {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-icon {
      font-size: 24px;
      color: #ffffff;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* ═══ Status Badge ═══ */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* ═══ Action Buttons ═══ */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 14px;
      border-radius: var(--radius-md);
      border: 1px solid #ffffff;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .secondary-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .footer-note {
      font-size: 12px;
      color: #71717a;
      margin-top: 18px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Content Card -->
  <div class="card-container">
    <div class="success-icon-wrapper">
      <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    </div>
    
    <h1>Login Successful!</h1>
    
    <p>
      Your account authentication is complete. Return to MEEM to access your synchronized profiles, library, and VIP features.
    </p>

    <!-- Connection Status Badge -->
    <div class="status-badge" id="status-container">
      <div class="status-dot"></div>
      <span id="status-text">Redirecting to MEEM...</span>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <a href="#" id="manual-link" class="action-btn">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        <span id="manual-link-text">Open MEEM</span>
      </a>

      <button type="button" id="copy-token-btn" class="secondary-btn">
        <i class="fa-regular fa-clone"></i>
        <span id="copy-token-text">Copy Access Token</span>
      </button>
    </div>

    <div class="footer-note" id="footer-note">
      If not redirected automatically, click <strong>Open MEEM</strong> to continue.
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const statusText = document.getElementById('status-text');
      const manualLink = document.getElementById('manual-link');
      const manualLinkText = document.getElementById('manual-link-text');
      const copyTokenBtn = document.getElementById('copy-token-btn');
      const copyTokenText = document.getElementById('copy-token-text');

      const rawSearch = window.location.search || '';
      const rawHash   = window.location.hash   || '';

      function collectParams() {
        const map = new Map();
        const addFrom = (str) => {
          if (!str) return;
          const clean = str.replace(/^[?#]/, '');
          try {
            new URLSearchParams(clean).forEach((v, k) => { if (v && !map.has(k)) map.set(k, v); });
          } catch (_) {}
        };
        addFrom(rawHash);
        addFrom(rawSearch);
        return map;
      }

      const params = collectParams();

      const errorCode = params.get('error');
      const errorDesc = params.get('error_description');
      if (errorCode || errorDesc) {
        const msg = errorDesc ? errorDesc.replace(/\+/g, ' ') : errorCode;
        statusText.innerText = 'Authentication Failed: ' + msg;
        document.querySelector('.status-dot').style.background = '#ef4444';
        document.querySelector('h1').innerText = 'Authentication Failed';
        document.querySelector('.success-icon').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444"></i>';
        manualLink.style.display = 'none';
        copyTokenBtn.style.display = 'none';
        return;
      }

      const code        = params.get('code');
      const accessToken = params.get('access_token');
      const refreshToken= params.get('refresh_token') || '';
      const source      = params.get('source') || '';
      const relayId     = params.get('relay_id') || params.get('auth_session_id');

      // Initialize Supabase Client to store token in localStorage
      let supabaseClient = null;
      try {
        if (window.supabase) {
          supabaseClient = supabase.createClient("https://vvjnkgdrhyxilnderjdy.supabase.co", "sb_publishable_hCdzzszncTGjIBGZYuoTNg_LZSnuHAw", {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
              storageKey: "supabase.auth.token"
            }
          });
        }
      } catch (e) {
        console.warn('Supabase init error:', e);
      }

      if (supabaseClient && accessToken) {
        try {
          await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });
        } catch (e) {
          console.warn('SetSession error:', e);
        }
      }

      if (!code && !accessToken) {
        statusText.innerText = 'No authentication token found.';
        document.querySelector('.status-dot').style.background = '#ef4444';
        manualLink.style.display = 'none';
        copyTokenBtn.style.display = 'none';
        return;
      }

      // Check if from web browser
      const isWeb = source.toLowerCase() === 'web' || (!relayId && !/electron|meem_app/i.test(navigator.userAgent || ''));

      if (isWeb) {
        statusText.innerText = 'Redirecting to MEEM...';
        manualLinkText.innerText = 'Return to MEEM';
        manualLink.href = '../../player/';
        
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage({
              type: 'MEEM_AUTH_SUCCESS',
              access_token: accessToken,
              refresh_token: refreshToken
            }, '*');
          } catch (_) {}
        }

        setTimeout(() => {
          window.location.href = '../../player/';
        }, 800);

        copyTokenBtn.addEventListener('click', () => {
          window.location.href = '../../player/';
        });
        return;
      }

      // Mobile / Desktop deep link logic
      if (relayId && (accessToken || code)) {
        try {
          const SUPABASE_URL = 'https://vvjnkgdrhyxilnderjdy.supabase.co';
          const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2am5rZ2RyaHl4aWxuZGVyamR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTM2ODEsImV4cCI6MjA5NDg4OTY4MX0.Rb1OLJGXDToYZz-8h_gy2UNx_ou0P6BwGXc1ExFWSCU';
          fetch(${SUPABASE_URL}/rest/v1/rpc/complete_mobile_auth_relay, {
            method: 'POST',
            keepalive: true,
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': Bearer 
            },
            body: JSON.stringify({
              p_relay_id: relayId,
              p_access_token: accessToken || ('code:' + code),
              p_refresh_token: refreshToken || '',
              p_user_id: null
            })
          }).catch(() => {});
        } catch (_) {}
      }

      let deepLinkFragment = '';
      if (code) {
        deepLinkFragment = '?code=' + encodeURIComponent(code);
      } else {
        deepLinkFragment = '#access_token=' + encodeURIComponent(accessToken) +
          (refreshToken ? '&refresh_token=' + encodeURIComponent(refreshToken) : '');
        ['type','provider_token','provider_refresh_token','expires_in','token_type'].forEach(k => {
          const v = params.get(k);
          if (v) deepLinkFragment += '&' + k + '=' + encodeURIComponent(v);
        });
      }

      const isAndroid = /android/i.test(navigator.userAgent || '');
      const deepLinkMeem = 'meem://auth/callback' + deepLinkFragment;
      const queryOrHash = deepLinkFragment.startsWith('?') ? deepLinkFragment.substring(1) : (deepLinkFragment.startsWith('#') ? deepLinkFragment.substring(1) : deepLinkFragment);
      const intentUri = 'intent://auth/callback?' + queryOrHash + '#Intent;scheme=meem;package=com.meem.app;end;';
      const tokenToCopy = deepLinkMeem;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(tokenToCopy).catch(() => {});
        }
      } catch (_) {}

      manualLink.href = isAndroid ? intentUri : deepLinkMeem;
      manualLinkText.innerText = 'Open MEEM App';

      if (isAndroid) {
        try {
          window.location.href = intentUri;
        } catch (_) {
          try { window.location.href = deepLinkMeem; } catch (_) {}
        }
      } else {
        try {
          window.location.replace(deepLinkMeem);
        } catch (_) {}
      }

      copyTokenBtn.addEventListener('click', () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(tokenToCopy).then(() => {
            copyTokenText.innerText = '✓ Copied! Return to MEEM';
            setTimeout(() => { copyTokenText.innerText = 'Copy Access Token'; }, 3000);
          }).catch(() => {
            copyTokenText.innerText = 'Failed to copy';
          });
        }
      });
    });
  </script>

</body>
</html>
