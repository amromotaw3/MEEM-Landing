<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEEM — Authentication Successful</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #09090b;
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.3);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ═══ Background Orbit Orbs ═══ */
    .background-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 80%;
      height: 80%;
      filter: blur(100px);
      will-change: transform;
    }

    .blob-1 {
      top: -20%;
      left: -20%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      animation: splashOrbit 12s infinite ease-in-out;
    }

    .blob-2 {
      bottom: -20%;
      right: -20%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
      animation: splashOrbit 16s infinite ease-in-out reverse;
    }

    @keyframes splashOrbit {
      0%, 100% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      25% {
        transform: translate(10%, 8%) scale(1.05) rotate(5deg);
      }
      50% {
        transform: translate(-5%, 15%) scale(0.95) rotate(-5deg);
      }
      75% {
        transform: translate(-10%, -3%) scale(1.02) rotate(3deg);
      }
    }

    /* ═══ Glass Card Container ═══ */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      padding: 40px 30px;
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ═══ Icon & Success Animations ═══ */
    .success-icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      animation: ringPulse 2s infinite ease-out;
    }

    .success-icon {
      font-size: 36px;
      color: #ffffff;
      text-shadow: 0 0 15px var(--accent-glow);
      z-index: 2;
      animation: checkPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    @keyframes ringPulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    @keyframes checkPop {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-15deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* ═══ Typography ═══ */
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    /* ═══ Sync status ═══ */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 25px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
      animation: dotPulse 1.5s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* ═══ Fallback Action Button ═══ */
    .action-btn {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      border: 1.5px solid #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 15px;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.25);
      background: #f4f4f5;
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .footer-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <!-- Background Mesh Orbs -->
  <div class="background-canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Content Card -->
  <div class="card-container">
    <div class="success-icon-wrapper">
      <div class="success-ring"></div>
      <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    </div>
    
    <h1>Login Successful!</h1>
    
    <p>
      We have securely linked your account. You can now close this browser window and return to the MEEM application to explore your updated dashboard.
    </p>

    <!-- Connection Status Badge -->
    <div class="status-badge" id="status-container">
      <div class="status-dot"></div>
      <span id="status-text">Linking session with MEEM...</span>
    </div>

    <!-- Manual Deep Link Fallback Button -->
    <a href="#" id="manual-link" class="action-btn">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
      Open MEEM App
    </a>

    <div class="footer-note">
      Didn't redirect? Click the button above to launch the application.
    </div>
  </div>

  <!-- Hidden iframe for localhost communication -->
  <iframe id="hidden-iframe" style="display:none; width:0; height:0; border:none;"></iframe>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const statusText = document.getElementById('status-text');
      const manualLink = document.getElementById('manual-link');

      // ── 1. Parse ALL params from both hash and query string ──────────────
      // Supabase PKCE flow sends: ?code=xxx  (query string)
      // Supabase implicit flow sends: #access_token=xxx  (hash fragment)
      const rawSearch = window.location.search || '';
      const rawHash   = window.location.hash   || '';

      function collectParams() {
        const map = new Map();
        const addFrom = (str) => {
          if (!str) return;
          const clean = str.replace(/^[?#]/, '');
          try {
            new URLSearchParams(clean).forEach((v, k) => { if (v && !map.has(k)) map.set(k, v); });
          } catch (_) {}
        };
        addFrom(rawHash);
        addFrom(rawSearch);
        return map;
      }

      const params = collectParams();

      // ── 2. Handle errors from Supabase / Google ──────────────────────────
      const errorCode = params.get('error');
      const errorDesc = params.get('error_description');
      if (errorCode || errorDesc) {
        const msg = errorDesc ? errorDesc.replace(/\+/g, ' ') : errorCode;
        statusText.innerText = 'Error: ' + msg;
        document.querySelector('.status-dot').style.cssText = 'background:#ef4444;box-shadow:0 0 10px #ef4444';
        document.querySelector('h1').innerText = 'Authentication Failed';
        document.querySelector('.success-icon').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444"></i>';
        manualLink.style.display = 'none';
        return;
      }

      const code        = params.get('code');
      const accessToken = params.get('access_token');
      const refreshToken= params.get('refresh_token') || '';

      if (!code && !accessToken) {
        statusText.innerText = 'No authentication token found. Please try again.';
        document.querySelector('.status-dot').style.cssText = 'background:#ef4444;box-shadow:0 0 10px #ef4444';
        manualLink.style.display = 'none';
        return;
      }

      // ── 3. Build the deep link back to the native app ────────────────────
      // Reconstruct a canonical fragment so the app's parseAuthCallbackParams
      // can find the tokens regardless of where Supabase put them.
      let deepLinkFragment;
      if (code) {
        deepLinkFragment = '?code=' + encodeURIComponent(code);
      } else {
        deepLinkFragment = '#access_token=' + encodeURIComponent(accessToken) +
          (refreshToken ? '&refresh_token=' + encodeURIComponent(refreshToken) : '');
        // Pass through any extra params the app might need (type, provider_token, etc.)
        ['type','provider_token','provider_refresh_token','expires_in','token_type'].forEach(k => {
          const v = params.get(k);
          if (v) deepLinkFragment += '&' + k + '=' + encodeURIComponent(v);
        });
      }

      const deepLinkMeem       = 'meem://auth/callback' + deepLinkFragment;
      const deepLinkFallback   = 'mediavault://callback' + deepLinkFragment;
      // Android Intent URL — forces the OS to resolve meem:// even from Chrome Custom Tabs
      const androidIntentMeem  = 'intent://auth/callback' + deepLinkFragment +
        '#Intent;scheme=meem;package=com.meem.app;S.browser_fallback_url=https%3A%2F%2Fmeem-watch.vercel.app;end;';

      // Update manual button
      manualLink.href = deepLinkMeem;
      manualLink.innerText = 'Open MEEM App';
      manualLink.style.display = 'inline-flex';

      // ── 4. Redirect sequence ──────────────────────────────────────────────
      statusText.innerText = 'Sending session to MEEM...';

      const tryRedirect = (url) => {
        try {
          const a = document.createElement('a');
          a.href = url;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (_) {}
      };

      // Attempt 1: Direct meem:// deep link (works when app is registered)
      setTimeout(() => tryRedirect(deepLinkMeem), 200);

      // Attempt 2: Android Intent URL (works from Chrome/Chrome Custom Tabs)
      setTimeout(() => { window.location.href = androidIntentMeem; }, 600);

      // Attempt 3: mediavault:// fallback
      setTimeout(() => tryRedirect(deepLinkFallback), 1000);

      // Update UI after attempts
      setTimeout(() => {
        statusText.innerText = 'Session ready. Tap below if the app did not open.';
        document.querySelector('.status-dot').style.cssText = 'background:#10b981;box-shadow:0 0 10px #10b981';
      }, 1600);

      // ── 5. Manual button click ───────────────────────────────────────────
      manualLink.addEventListener('click', (e) => {
        e.preventDefault();
        tryRedirect(deepLinkMeem);
        setTimeout(() => { window.location.href = androidIntentMeem; }, 400);
      });
    });
  </script>

</body>
</html>
